
name: UFW Config Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install UFW
        run: |
          sudo apt-get update
          sudo apt-get install -y ufw
          sudo ufw --force enable

      - name: Run add-rules.sh
        run: |
          sudo bash -e add-rules.sh ufw-config.txt
          echo "Current directory:"
          pwd
          echo "Generated files:"
          ls -la
          echo "Generated UFW config:"
          cat ufw-config.txt
          echo "UFW status:"
          sudo ufw status numbered

      - name: Verify UFW Config
        run: |
          if [ ! -f ufw-config.txt ]; then
            echo "UFW config file not found."
            exit 1
          fi

          if ! grep -Eq "6050:6055/tcp[[:space:]]+LIMIT IN[[:space:]]+Anywhere" ufw-config.txt; then
            echo "Port range limit rule not found."
            exit 1
          fi

          if ! grep -Eq "8099 on eth0[[:space:]]+ALLOW IN[[:space:]]+Anywhere" ufw-config.txt; then
            echo "Management panel rule not found."
            exit 1
          fi

          if ! grep -Eq "3005[[:space:]]+REJECT IN[[:space:]]+Anywhere" ufw-config.txt; then
            echo "Admin panel reject rule not found."
            exit 1
          fi

          echo "All UFW rules verified successfully."

